%YAML:1.0
# race: direct GPIO13 PWM 200 Hz, range 40000; no pulse mapping.
camera_device: "/dev/v4l/by-id/usb-H65_USB_CAMERA_H65_USB_CAMERA-video-index0"
width: 640
height: 480
# V4L2: 3 = automatic exposure, 1 = manual. Manual 200 washed out the current indoor scene.
set_auto_exposure: 3
set_exposure: 200
# Automatic home DISABLED: user clarified the approved pose was set by physically moving the bracket.
# The dormant 71/76 values came from older remote commands and are NOT a calibration of the manual pose.
# Electrical pose calibration is required before enabling automatic return.
camera_home_enabled: 0
camera_pan_pwm: 71
camera_tilt_pwm: 76
# Original live lane PD and steering calibration.
lane_pd_kp: 0.2
lane_pd_kd: 0.5
# 实车直线校准：原中位 80 加偏置 -2，已合并为 78；运行时不再叠加 -2。
servo_center: 80
servo_min: 55
servo_max: 86
# Original timed lane throttle (27s braking stage is intentionally retained).
speed:
  neutral_pwm: 10000  # GPIO13 直接 PWM 停车控制值
  start_pwm: 10900  # 独立原版巡线：起步阶段
  corner_pwm: 10900  # 独立原版巡线：gear=1 弯道阶段
  corner_fast_pwm: 12000  # 独立原版巡线：gear=2，原2200偏移经限幅后实际为12000
  corner_brake_pwm: 7500  # 原版制动值；低于停车中位，不是普通停车命令
  after_corner_pwm: 10900  # 独立原版巡线：弯道阶段结束后
  gear: 1  # 独立原版的挡位选择，默认1
  start_s: 2  # 独立原版起步阶段秒数
  corner_end_s: 27  # 独立原版弯道阶段结束时刻，从开始运行计秒
  corner_brake_s: 0  # 独立原版弯道后的制动持续秒数

# White tape on the current wooden indoor floor; coordinates are 640x480.
lane_roi_top: 300
lane_roi_bottom: 470
white_s_max: 85
white_v_min: 150
lane_hough_votes: 28
lane_min_span: 55
lane_fit_tolerance: 18.
# Full-resolution blue detection; no erosion of small distant cones.
cone_roi_top: 280
cone_h_min: 100
cone_h_max: 130
cone_s_min: 40
cone_v_min: 55
cone_min_pixels: 10
cone_min_height: 4
cone_confirm_frames: 2
cone_avoid_start_y: 300.
cone_full_avoid_y: 420.
cone_pass_y: 445.
# IMAGE-space margin, not calibrated vehicle width.
cone_clearance_fraction: 0.18
cone_slow_pwm: 10700
steer_rate: 40.

# Blue board selects the opposite parking half; only QR triggers final stop.
board_h_min: 100
board_h_max: 130
board_s_min: 60
board_v_min: 55
board_roi_top: 100
board_roi_left: 64
board_roi_right: 576
board_min_area: 1500
board_min_width: 40
board_min_height: 25
board_min_fill: 0.82
board_min_aspect: 0.8
board_max_aspect: 5.
board_confirm_frames: 3
board_confirm_seconds: 0.12

# 转向修正限幅；默认15，限制范围(0,15]，不会放宽舵机机械边界。
pd_limit: 15.

# 补全原有锥桶配置：默认值与之前代码相同。
# 候选最大宽度，像素
cone_max_width: 180
# 候选高/宽的下限
cone_aspect_min: 0.55
# 候选高/宽的上限
cone_aspect_max: 4.5
# 框内蓝色像素占比下限
cone_fill_min: 0.22
# 扣除余量后通道最小剩余宽度比例
cone_min_gap_fraction: 0.025
# 短暂漏检保持原目标的秒数
cone_lost_grace_s: 0.3
# 判定通过需要观察到的向下移动像素数
cone_approach_pixels: 35
# 通过判定最短观察秒数
cone_approach_seconds: 0.2
# 同时检查两桶占道的纵坐标差范围
cone_close_depth_px: 70
# 目标平滑时间，越大变化越慢
cone_smooth_seconds: 0.10
# 绕桶目标每秒最大横向偏移比例
cone_offset_rate: 1.0

# 半区停车 / 二维码，坐标基于640x480；不是厘米。
# 挡板靠近车道中线时不选侧的宽度比例；范围 0..0.2
parking_side_deadband: 0.04
# 判断挡板侧别所需的最小车道宽度，像素；范围 20..500
parking_min_lane_width: 60
# 选侧连续确认帧数；范围 1..30
parking_side_frames: 3
# 所选半区目标相对车道中线偏移比例；范围 0.05..0.4
parking_target_offset: 0.25
# 半区目标每秒最大偏移比例；范围 0.05..1.0
parking_offset_rate: 0.35
# 二维码框最小宽度和高度，像素；范围 8..200
qr_min_size: 20
# 二维码框顶部必须低于此行；范围 0..450
qr_min_y: 100
# 连续二维码框匹配的最小重叠率；范围 0.05..0.9
qr_match_iou: 0.3
# 最终停车二维码连续确认帧数；范围 2..30
qr_confirm_frames: 3

# 本次按要求关闭：控制更新超时不会触发停车退出；卡顿时保持上一条指令。
control_watchdog_enabled: 0
control_watchdog_ms: 300
# 绕桶专用 PD；普通巡线仍用 lane_pd_kp / lane_pd_kd。
cone_pd_kp: 0.55
cone_pd_kd: 0.20
# 绕桶有效非零修正的最小 PWM 幅度；0 禁用补偿。
cone_min_correction: 1.0
# 到达起绕位置时立即请求完整横向目标的40%，随后仍经过平滑。
cone_start_blend: 0.60
# 同时满足连续帧数和观察秒数才确认；0 表示只按 cone_confirm_frames。
cone_confirm_seconds: 0.0

# Two real visible lane fits may extend outside the near image by this many pixels.
cone_lane_extrapolation_px: 320.

lane_backend: "indoor"

# Shared module integration. Each environment has its own copy.
parking_mode: "yellow" # Yellow/white path; dark-in-white panel stop
parking_after_cones: 2
camera_fps: 30
camera_brightness: -1
camera_gain: -1
camera_white_balance_auto: -1
zebra_white_s_max: 75
zebra_white_v_min: 175
zebra_min_stripes: 4
zebra_confirm_frames: 2
zebra_roi_left: 0.12
zebra_roi_right: 0.88
zebra_roi_top: 0.45
zebra_roi_bottom: 0.94
zebra_min_stripe_width: 0.008
zebra_max_stripe_width: 0.14
zebra_min_span: 0.12
zebra_min_support_height: 0.008
zebra_max_width_ratio: 2.2
zebra_max_pitch_ratio: 1.8
zebra_min_gap_ratio: 0.15
zebra_max_gap_ratio: 2.5
zebra_stop_y: 0.65
zebra_hold_seconds: 10.
zebra_brake_seconds: 1.0
zebra_brake_pwm: 8000

# NEW parking-only calibration. Existing lane/zebra settings live in the frozen baseline.
# Geometry/PWM-to-speed are provisional simulator assumptions, not measured vehicle values.
camera_height_m: 0.14
camera_forward_m: 0.17
camera_pitch_deg: 15.0
camera_hfov_deg: 120.0
lane_width_m: 1.22
wheelbase_m: 0.26
vehicle_length_m: 0.40
vehicle_width_m: 0.28
pwm_speed_scale: 0.0005
steering_rad_per_pwm: 0.032
parking_length_m: 1.50
parking_depth_m: 0.75
parking_lookahead_m: 0.65
parking_approach_pwm: 10900
parking_enter_pwm: 10900
parking_board_confirm_frames: 2
parking_entry_confirm_frames: 3
parking_blue_s_min: 140
parking_brake_distance_m: 0.07
parking_max_seconds: 45.0
parking_max_blind_m: 1.20

# Actual visible white fits may extend beyond the near image edge.
lane_fit_margin_px: 160
# Retry small QR localization at this scale, then convert back to original pixels.
qr_detect_scale: 2

# Small QR: crop bright panel above blue-board foot; still require real QR.
qr_panel_v_min: 110
qr_panel_s_max: 80

# 室内：只识别第一个桶一次，整套 S 形跨过两个桶后恢复巡线，不再检测第二桶。
cone_fixed_maneuver: 1
cone_s_course_once: 1
# 0=按第一个桶位置选反侧；1=首次向右绕；-1=首次向左绕。整个 S 共用这个方向。
cone_fixed_side: 1
# 初值待实车调整；“两桶间距小于3米”不能直接换算秒数，以下不是实测轨迹。
# 正 steer 朝首次绕行侧，负 steer 朝相反侧，0舵机回正；单位PWM，不是角度。
# PWM目标=servo_center-side*steer，仍受55..86限位；中心78，左右可用幅度不同。
# 每段必须>0且<=15秒，可增删/重排，最多20段，总计<=60秒。
cone_s_steps:
  - { name: FIRST_OUT,    steer:  8.0, seconds: 0.25, motor_pwm: 10900 } # 向第一桶反侧转出
  - { name: FIRST_ALIGN,  steer: -3.0, seconds: 0.25, motor_pwm: 10900 } # 反打摆正到第一桶旁
  - { name: FIRST_PASS,   steer:  0.0, seconds: 0.90, motor_pwm: 10900 } # 直行越过第一桶
  - { name: CROSS,        steer: -8.0, seconds: 0.25, motor_pwm: 10900 } # 跨向第二桶的另一侧
  - { name: SECOND_ALIGN, steer:  3.0, seconds: 0.25, motor_pwm: 10900 } # 摆正在第二桶旁
  - { name: SECOND_PASS,  steer:  0.0, seconds: 0.25, motor_pwm: 10900 } # 直行越过第二桶
  - { name: RETURN,       steer:  8.0, seconds: 0.15, motor_pwm: 10900 } # 向车道中间回转
  - { name: FINAL_ALIGN,  steer: -1.0, seconds: 0.15, motor_pwm: 10900 } # 最后反打摆正
  - { name: SETTLE,       steer:  0.0, seconds: 0.05, motor_pwm: 10900 } # 短直行，然后交还巡线
# S_DONE 后本次运行不再触发锥桶动作；要重试整套 S，退出后重新启动程序。
# passed=1 表示执行完一次S路线，不是视觉确认通过了两个桶。
# 本模式停车解锁直接看 S_DONE，parking_after_cones 不参与；旧的消失/冷却计数也不参与。

# 室内停车：挡板左 -> 右侧移并持续沿右边线；挡板右 -> 持续沿左边线。
# 先固定侧移并反打摆正，再持续沿边线；不回中，直到所选半区二维码确认才最终停车。
parking_fixed_maneuver: 0
parking_edge_follow: 1
# 停车阶段独立前进油门，选侧完成后生效，不受cone_slow_pwm或普通巡线分段油门限制。
# 电机带不动时调高这个值，例如10900 -> 11000 -> 11100；须>neutral_pwm且<=12000。
parking_follow_pwm: 10900
# 目标车中心离所选边线的距离 / 已观测车道宽度：当前0.25=留25%的车道宽。
# 越小越贴边，越大越往车道内侧；范围0.08..0.45，不是厘米，也不是车身外沿间距。
parking_edge_margin_fraction: 0.25
# 挡板选侧后锁定；另一边线缺失可沿选定边线继续，所选边线缺失则停等该边线恢复。
# 另一边线不可见时留边距离用最近双侧真实观测的车道宽度估计。
# 本模式不使用 parking_target_offset/parking_offset_rate，也不使用原parking_maneuver_steps/parking_qr_seek_pwm。

# 以下PD/限幅只用于摆正后的沿边闭环，不限制前面的固定侧移动作。
parking_shift_rate: 0.10             # 仅旧版parking_edge_entry=0渐进模式使用；新版固定侧移不用它
parking_pd_kp: 0.18                  # 停车专用比例增益；普通巡线PD不变
parking_pd_kd: 0.08                  # 停车专用每帧误差差分增益；首次接管不产生D冲击
parking_steer_limit: 3.0             # 相对servo_center的最大修正PWM；当前78对应75..81
parking_steer_rate: 3.0              # 每秒最大转向PWM变化；越小打方向越缓
parking_error_smooth_seconds: 0.20   # 停车误差平滑秒数；越大越平缓，但响应越慢
# 目标进度只在沿边前进命令实际输出时推进；等灯/等边线期间不继续侧移。

# 新室内贴边：固定侧移 -> 反打摆正 -> 短直行 -> 持续沿选定边线。
parking_edge_entry: 1
# 正steer向空闲侧，负steer反打；右侧移时PWM=servo_center-steer，左侧移时镜像。
# steer单位PWM，不是角度；seconds是前进命令持续秒数，等灯/丢线停等时暂停。
# 初值需实车调；严格三段，OUT为正、ALIGN为负、SETTLE为0。没有回中段。
# timed 模式：OUT 转出、ALIGN 反打、SETTLE 回正直行；完成后 PARK_TIMED_STOP。
# seconds 均可调；SETTLE.seconds 为最后直行时间，默认2秒。
parking_edge_entry_steps:
  - { name: OUT,    steer:  8.0, seconds: 0.80, motor_pwm: 10900 }
  - { name: ALIGN,  steer: -3.0, seconds: 0.60, motor_pwm: 10900 }
  - { name: SETTLE, steer:  0.0, seconds: 0.10, motor_pwm: 10900 }
# 沿边额外看近端与远端的归一化偏差差值，车头斜向边线时提前反打。
parking_heading_kp: 0.8
# 实时室内二维码后台识别；巡线/侧移定时不再等QR搜索。离线回放保持同步、可复现。
parking_qr_async: 1

# Connected blue pixels; 640x480 input. No quadrilateral/aspect/fill filtering.
board_pixel_mode: 1
board_min_pixels: 4500

# After SETTLE: bounded reverse, then latched neutral. 0 seconds disables reverse.
parking_reverse_pwm: 8000
parking_reverse_seconds: 0.3

parking_yellow_h_min: 18
parking_yellow_h_max: 40
parking_yellow_s_min: 60
parking_yellow_v_min: 100
parking_yellow_roi_top: 130
parking_yellow_roi_bottom: 470
parking_yellow_min_span: 55
parking_yellow_pwm: 10600
parking_yellow_kp: 0.2
parking_yellow_kd: 0.08
parking_yellow_steer_limit: 6.
parking_yellow_steer_rate: 12.

# Distant T crossbar appears pale: only crossbar uses these relaxed thresholds.

# Indoor: yellow divider + yellow outer boundary (outdoor defaults to 0).

parking_wait_side_pwm: 10600 # WAIT_BOARD_SIDE speed

# White panel with an internal dark block; yellow T no longer stops the car.
parking_panel_white_v_min: 190
parking_panel_white_s_max: 85
parking_panel_dark_v_max: 160
parking_panel_min_area: 2000
parking_panel_min_bottom: 250
parking_panel_confirm_frames: 3
parking_panel_confirm_seconds: 0.5

# Loose QR-like black/white texture; no decoding required.
parking_panel_texture_min_size: 16
parking_panel_texture_transitions: 8
parking_panel_texture_fraction: 0.4

# One entry turn toward selected side, then yellow/white line following.
parking_yellow_entry_seconds: 0.3
parking_yellow_entry_steer: 8.0
parking_yellow_entry_pwm: 10500

# Side from blue-board center versus nearby yellow crossbar midpoint.
parking_side_yellow_bar: 1
parking_side_bar_min_width: 80
parking_side_bar_near_y: 45
parking_side_bar_frames: 2
parking_side_bar_max_slope: 0.18
parking_side_bar_deadband: 0.04

# Manual direction overrides side selection ONLY after blue-board confirmation.
parking_manual_side_enabled: 0
parking_manual_side: 1 # 1 RIGHT, -1 LEFT

# Delay after final neutral stop before saving one photo.
parking_photo_delay_seconds: 0.2

# parking2: 蓝板确认后选其反侧的横向黄线，中点竖线跟踪；丢线回正直行；白板锁停。
# 使用 --modules lane,parking2；当前 parking_mode: yellow 供原 parking 保持原行为。
parking2_yellow_h_min: 18
parking2_yellow_h_max: 40
parking2_yellow_s_min: 60
parking2_yellow_v_min: 100
parking2_roi_top: 180
parking2_roi_bottom: 470
parking2_min_length: 65
parking2_hough_votes: 25
parking2_max_gap: 18
parking2_max_slope: 0.25
parking2_side_frames: 2
parking2_side_gap_px: 25
parking2_follow_pwm: 10600
parking2_kp: 0.4
parking2_kd: 0.5
parking2_steer_limit: 15.0
parking2_steer_rate: 40.0
# 停车白板识别沿用上方 parking_panel_* 阈值与连续确认设置。

# parking2 边缘蓝挡板补检：HSV 与最小连通区域；可识别贴画面边缘的挡板。
parking2_blue_h_min: 100
parking2_blue_h_max: 130
parking2_blue_s_min: 60
parking2_blue_v_min: 55
parking2_blue_min_pixels: 2500
parking2_blue_min_height: 100
parking2_blue_confirm_frames: 2

# parking2 蓝挡板可见时，所选侧可信白边的 HSV 与线段筛选。
parking2_white_s_max: 70
parking2_white_v_min: 150
parking2_white_min_length: 65
parking2_white_min_gap: 25
parking2_white_max_slope: 1.6

# parking2 选侧后的黄线＋白线巡线；只对纵向黄线生效，横黄线选侧仍用 parking2_yellow_*。
parking2_lane_yellow_h_min: 18
parking2_lane_yellow_h_max: 40
parking2_lane_yellow_s_min: 60
parking2_lane_yellow_v_min: 100
parking2_lane_yellow_min_length: 65
parking2_lane_yellow_max_slope: 1.6
parking2_lane_min_gap: 60
parking2_lane_max_gap: 550
parking2_blue_leave_frames: 2

# parking2 白色矩形停车（无需内部二维码或暗块）。
parking2_stop_white_v_min: 230
parking2_stop_white_s_max: 120
parking2_stop_min_area: 2500
parking2_stop_min_bottom: 200
parking2_stop_min_fill: 0.65
parking2_stop_confirm_frames: 3
parking2_stop_confirm_seconds: 0.2
parking2_stop_center_tolerance: 0.3

# 暗光停车板：较低亮度的浅色矩形需被深色边框包围。
parking2_stop_dim_v_min: 90
parking2_stop_dim_s_max: 90
parking2_stop_dark_v_max: 100
parking2_stop_dark_ring_fraction: 0.6

# parking3: same board-side/white-panel criteria as parking2, single outer white boundary.
parking3_yellow_h_min: 18
parking3_yellow_h_max: 40
parking3_yellow_s_min: 60
parking3_yellow_v_min: 100
parking3_roi_top: 180
parking3_roi_bottom: 470
parking3_min_length: 65
parking3_hough_votes: 25
parking3_max_gap: 18
parking3_max_slope: 0.25
parking3_side_frames: 2
parking3_side_gap_px: 25
parking3_follow_pwm: 10600
parking3_kp: 0.4
parking3_kd: 0.5
parking3_steer_limit: 15.0
parking3_steer_rate: 40.0
parking3_white_s_max: 70
parking3_white_v_min: 150
parking3_white_min_length: 65
parking3_white_min_gap: 25
parking3_white_max_slope: 1.6
parking3_lane_yellow_h_min: 18
parking3_lane_yellow_h_max: 40
parking3_lane_yellow_s_min: 60
parking3_lane_yellow_v_min: 100
parking3_lane_yellow_min_length: 65
parking3_lane_yellow_max_slope: 1.6
parking3_lane_min_gap: 60
parking3_lane_max_gap: 550
parking3_stop_white_v_min: 230
parking3_stop_white_s_max: 120
parking3_stop_min_area: 2200
parking3_stop_min_bottom: 200
parking3_stop_min_fill: 0.65
parking3_stop_confirm_frames: 3
parking3_stop_confirm_seconds: 0.2
parking3_stop_center_tolerance: 0.3
parking3_stop_dim_v_min: 90
parking3_stop_dim_s_max: 90
parking3_stop_dark_v_max: 100
parking3_stop_dark_ring_fraction: 0.6
# 640x480 pixels. Increase distance to move inward away from selected white edge.
parking3_distance_near_px: 130.0
parking3_distance_far_px: 40.0
# Positive bias moves target RIGHT, negative LEFT; 1 error unit = 8 pixels.
parking3_error_bias: 0.0
parking3_line_hold_seconds: 0.3
parking3_wait_side_pwm: 10500

# parking3 uses shared board_min_pixels / board_confirm_*; no independent lower pixel bypass.
parking3_board_full_width: 1 # include boards touching image edges; 0 uses shared board_roi_left/right

# 红绿灯：只追加本模块字段，原巡线/绕桶/停车标定保持原值。
light_brake_pwm: 8000
light_brake_seconds: 0.8
light_green_seconds: 0.5
light_after_zebra_enabled: 1
light_after_zebra_seconds: 3.0
light_slow_pwm: 10700
light_slow_settle_seconds: 0.3
light_detect_interval_ms: 100
